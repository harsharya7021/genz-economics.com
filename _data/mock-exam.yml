- n: 14
  q: During a crisis, RBI injects large reserves but lending does not increase. Why?
  options:
  - CRR too high
  - Banks unwilling to lend due to risk
  - Deposits too low
  - Currency demand too high
  answer: B
  why: This is what happened after global financial crisis. All money goes to SDF. Without lending,
    no money creation.
- n: 15
  q: In The Merchant of Venice, a pound of flesh was pledged as collateral for a loan. The court
    eventually rules that the lender can enforce the collateral but cannot shed even a drop
    of blood. Which of the following judgments/laws are in the same spirit?
  options:
  - Government enacts the Insolvency and Bankruptcy Code (IBC), under which the borrower (promoter)
    loses control over the firm once the case is admitted
  - Court rules that banks can file recovery cases (under SARFAESI) only in the borrower’s location,
    whereas earlier banks could choose the location
  - RBI increases penalties for wilful default
  - Government extends strict recovery laws to non-banks as well
  answer: B
  why: Realize that the judgement is dilution of creditor rights. Rest are increase in creditor
    rights.
- n: 17
  q: I used to walk to a nearby restaurant for dinner. Now I order food using Zomato. This gives
    employment to the delivery person and leads to higher long-term economic growth. What is
    wrong with this statement?
  options:
  - It does not explain how I earn more to pay more
  - It does not explain whether the Zomato delivery person will spend or save
  - It does not explain whether I would have spent or saved the money
  - All of the above
  answer: A
  why: Long term growth happens when I earn and spend. Keynesian explanations based on demand
    do not work.
