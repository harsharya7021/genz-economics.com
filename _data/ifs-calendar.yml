# Indian financial system — events calendar.
# Generated 2026-07-03 from official schedules (RBI MPC calendar FY27 of 23-Mar-2026,
# MoSPI advance release calendar patterns, federalreserve.gov FOMC calendar).
# `shifted: true` = weekend rule applied (release moves to next working day).
# FY28 MPC dates (Apr/Jun 2027) land ~March 2027 — add when RBI publishes.
rules:
  - { day: "12th of every month", what: "CPI inflation", who: "NSO / MoSPI", note: "16:00 IST; next working day if holiday. The MPC's target variable." }
  - { day: "14th of every month", what: "WPI inflation", who: "Office of the Economic Adviser, DPIIT", note: "Wholesale basket, no services." }
  - { day: "28th of every month", what: "IIP", who: "NSO / MoSPI", note: "Industrial production, ~6-week lag." }
  - { day: "1st of every month", what: "GST collections; PMI (mfg 1st, services 3rd business day); auto sales", who: "GSTN / S&P Global / SIAM", note: "The fast indicators." }
  - { day: "~15th of every month", what: "Merchandise trade data", who: "Ministry of Commerce", note: "Exports, imports, the deficit." }
  - { day: "Every Friday, 17:00", what: "Weekly Statistical Supplement (money supply, forex reserves)", who: "RBI", note: "Alternate Fridays add fortnightly bank credit & deposit growth — the series behind the 2024 deposit-growth fight." }
  - { day: "Mid-month", what: "RBI monthly Bulletin", who: "RBI", note: "The State of the Economy chapter is a free macro briefing. Original data, not newspaper summaries." }
  - { day: "6 times a year", what: "MPC bi-monthly policy", who: "RBI", note: "Three-day meetings; decision on day 3 at 10:00. FY27: Apr, Jun, Aug, Oct, Dec, Feb." }
  - { day: "8 times a year", what: "US FOMC", who: "Federal Reserve", note: "14:00 ET. Projections in Mar/Jun/Sep/Dec." }
events:
  - { date: 2026-07-13, title: "CPI inflation (NSO)", cat: data, time: "16:00 IST", shifted: true, note: "Retail inflation, the MPC's target variable (4% +/-2). New 2024 base since Feb 2026." }
