- deck: "Monetary policy"
  cards:
    - q: "What is the repo rate?"
      a: "The rate at which the RBI lends to commercial banks against collateral. It is the policy lever the MPC sets at each meeting."
    - q: "SDF vs MSF — what are they?"
      a: "SDF is the corridor floor (banks park cash with the RBI, no collateral). MSF is the ceiling (emergency borrowing). The repo rate sits between them."
    - q: "What does VRRR do?"
      a: "A Variable Rate Reverse Repo absorbs surplus liquidity from the banking system, nudging the overnight rate up toward the repo rate."
    - q: "Why target CPI rather than WPI?"
      a: "CPI reflects the prices households actually face, so it maps to welfare and inflation expectations the MPC tries to anchor."
- deck: "Keynesian short run"
  cards:
    - q: "What is the multiplier?"
      a: "The ratio of the change in output to the initial change in spending. With MPC = c, the simple multiplier is 1/(1−c)."
    - q: "Paradox of thrift?"
      a: "If everyone tries to save more at once, aggregate demand falls, output drops, and realised saving may not rise at all."
    - q: "Why is the short-run AS curve upward sloping?"
      a: "Sticky prices and wages mean firms meet extra demand by raising output before fully raising prices."
- deck: "Open economy"
  cards:
    - q: "Covered interest parity?"
      a: "The forward premium on a currency equals the interest-rate differential, so hedged returns are equalised across currencies."
    - q: "Real vs nominal exchange rate?"
      a: "The real rate adjusts the nominal rate for relative price levels; it's what actually drives competitiveness."
    - q: "Why can a falling rupee be 'mechanical'?"
      a: "Inflation and interest-rate differentials imply gradual depreciation; a slide in line with those is expected, not a crisis."
