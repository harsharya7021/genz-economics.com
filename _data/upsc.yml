# UPSC economy/finance question bank — sourced from public UPSC CSE PYQs.
# MCQs: official Prelims GS Paper I economy questions (answer = 0-based index).
# Descriptive: official Mains GS Paper III economy questions (for daily discussion).
mcq:
  - q: '"Rapid Financing Instrument" and "Rapid Credit Facility" are related to the provisions of lending by which of the following?'
    options: ["Asian Development Bank", "International Monetary Fund", "UNEP Finance Initiative", "World Bank"]
    answer: 1
    year: 2022
    topic: "External sector"
  - q: "Consider: 1) An increase in NEER indicates rupee appreciation. 2) An increase in REER indicates improved trade competitiveness. 3) Rising domestic inflation relative to others widens the NEER–REER divergence. Which are correct?"
    options: ["1 and 2 only", "2 and 3 only", "1 and 3 only", "1, 2 and 3"]
    answer: 2
    year: 2022
    topic: "External sector"
  - q: "Consider: 1) If inflation is too high, RBI is likely to buy government securities. 2) If the rupee is rapidly depreciating, RBI is likely to sell dollars. 3) If US/EU interest rates fall, RBI is likely to buy dollars. Which are correct?"
    options: ["1 and 2 only", "2 and 3 only", "1 and 3 only", "1, 2 and 3"]
    answer: 1
    year: 2022
    topic: "Monetary policy"
  - q: 'With reference to the "G20 Common Framework": 1) It is endorsed by the G20 together with the Paris Club. 2) It supports Low Income Countries with unsustainable debt. Which is/are correct?'
    options: ["1 only", "2 only", "Both 1 and 2", "Neither 1 nor 2"]
    answer: 2
    year: 2022
    topic: "External sector"
  - q: "In India, which one of the following is responsible for maintaining price stability by controlling inflation?"
    options: ["Department of Consumer Affairs", "Expenditure Management Commission", "Financial Stability and Development Council", "Reserve Bank of India"]
    answer: 3
    year: 2022
    topic: "Inflation"
  - q: "The money multiplier in an economy increases with which one of the following?"
    options: ["Increase in the Cash Reserve Ratio", "Increase in the Statutory Liquidity Ratio", "Increase in the banking habit of the people", "Increase in the population"]
    answer: 2
    year: 2021
    topic: "Monetary policy"
  - q: "Demand-pull inflation can be caused/increased by: 1) Expansionary policies 2) Fiscal stimulus 3) Inflation-indexing wages 4) Higher purchasing power 5) Rising interest rates."
    options: ["1, 2 and 4 only", "3, 4 and 5 only", "1, 2, 3 and 5 only", "1, 2, 3, 4 and 5"]
    answer: 0
    year: 2021
    topic: "Inflation"
    q: "The Central Bank's function as \"lender of last resort\" usually refers to: 1) Lending to trade/industry bodies that fail to borrow elsewhere 2) Providing liquidity to banks in temporary crisis 3) Lending to governments to finance deficits."
    options: ["1 and 2", "2 only", "2 and 3", "3 only"]
    answer: 1
    year: 2021
    topic: "Banking"
  - q: "Which step is most likely to be taken at the time of an economic recession?"
    options: ["Cut tax rates with a rise in interest rate", "Increase expenditure on public projects", "Raise tax rates with a cut in interest rate", "Reduce expenditure on public projects"]
    answer: 1
    year: 2021
    topic: "Fiscal policy"
  - q: "Indian Government Bond yields are influenced by: 1) Actions of the US Federal Reserve 2) Actions of the RBI 3) Inflation and short-term interest rates."
    options: ["1 and 2 only", "2 only", "3 only", "1, 2 and 3"]
    answer: 3
    year: 2021
    topic: "Financial markets"
  - q: "Which one of the following is likely to be the most inflationary in its effects?"
    options: ["Repayment of public debt", "Borrowing from the public to finance a deficit", "Borrowing from banks to finance a deficit", "Creation of new money to finance a deficit"]
    answer: 3
    year: 2021
    topic: "Inflation"
  - q: "Consider: 1) Food has higher weight in CPI than in WPI. 2) WPI does not capture services prices, which CPI does. 3) RBI has adopted WPI as its key inflation measure for policy rates. Which is/are correct?"
    options: ["1 and 2 only", "2 only", "3 only", "1, 2 and 3"]
    answer: 0
    year: 2020
    topic: "Inflation"
  - q: 'Consider: 1) Commercial Paper is a short-term unsecured promissory note. 2) Certificate of Deposit is a long-term instrument issued by RBI to a corporation. 3) "Call Money" is short-term finance for interbank transactions. 4) "Zero-Coupon Bonds" are interest-bearing short-term bonds issued by banks. Which is/are correct?'
    options: ["1 and 2 only", "4 only", "1 and 3 only", "2, 3 and 4 only"]
    answer: 2
    year: 2020
    topic: "Financial markets"
  - q: "If you withdraw 1,00,000 in cash from your Demand Deposit Account, the immediate effect on aggregate money supply will be:"
    options: ["reduce it by 1,00,000", "increase it by 1,00,000", "increase it by more than 1,00,000", "leave it unchanged"]
    answer: 3
    year: 2020
    topic: "Monetary policy"
  - q: "In a given year in India, official poverty lines are higher in some States than others because:"
    options: ["poverty rates vary by State", "price levels vary by State", "Gross State Product varies by State", "quality of public distribution varies by State"]
    answer: 1
    year: 2019
    topic: "Poverty"
  - q: "Which of the following is issued by registered FPIs to overseas investors who want exposure to the Indian stock market without registering directly?"
    options: ["Certificate of Deposit", "Commercial Paper", "Promissory Note", "Participatory Note"]
    answer: 3
    year: 2019
    topic: "Financial markets"
  - q: "Which of the following is NOT included in the assets of a commercial bank in India?"
    options: ["Advances", "Deposits", "Investments", "Money at call and short notice"]
    answer: 1
    year: 2019
    topic: "Banking"
  - q: "The Chairman of public sector banks are selected by the:"
    options: ["Banks Board Bureau", "Reserve Bank of India", "Union Ministry of Finance", "Management of the concerned bank"]
    answer: 0
    year: 2019
    topic: "Banking"
  - q: 'Which one best describes the term "Merchant Discount Rate"?'
    options: ["Incentive given by a bank to a merchant for accepting that bank's debit cards", "Amount banks pay back to customers for debit-card use", "Charge to a merchant by a bank for accepting payments via debit cards", "Government incentive to merchants for promoting digital payments"]
    answer: 2
    year: 2018
    topic: "Banking"
  - q: "Which one of the following links all the ATMs in India?"
    options: ["Indian Banks' Association", "National Securities Depository Limited", "National Payments Corporation of India", "Reserve Bank of India"]
    answer: 2
    year: 2018
    topic: "Banking"
  - q: "Which statement correctly describes the meaning of legal tender money?"
    options: ["Money tendered in courts to pay legal fees", "Money a creditor is compelled to accept in settlement of claims", "Bank money such as cheques, drafts, bills of exchange", "Metallic money in circulation"]
    answer: 1
    year: 2018
    topic: "Monetary policy"
  - q: 'The term "Base Erosion and Profit Shifting" is seen in the news in the context of:'
    options: ["mining by MNCs in backward areas", "curbing tax evasion by multinational companies", "exploitation of genetic resources by MNCs", "ignoring environmental costs in projects"]
    answer: 1
    year: 2016
    topic: "Taxation"
  - q: '"Global Financial Stability Report" is prepared by the:'
    options: ["European Central Bank", "International Monetary Fund", "International Bank for Reconstruction and Development", "OECD"]
    answer: 1
    year: 2016
    topic: "External sector"
  - q: '"Basel III Accord" seeks to:'
    options: ["develop strategies for biodiversity conservation", "improve the banking sector's ability to handle financial/economic stress and risk", "reduce greenhouse gas emissions", "transfer technology to replace CFCs"]
    answer: 1
    year: 2015
    topic: "Banking"
  - q: "The problem of international liquidity is related to the non-availability of:"
    options: ["goods and services", "gold and silver", "dollars and other hard currencies", "exportable surplus"]
    answer: 2
    year: 2015
    topic: "External sector"
  - q: 'In the Indian economy, "Open Market Operations" refers to:'
    options: ["borrowing by scheduled banks from the RBI", "lending by commercial banks to industry and trade", "purchase and sale of government securities by the RBI", "None of the above"]
    answer: 2
    year: 2013
    topic: "Monetary policy"
  - q: "An increase in the Bank Rate generally indicates that the:"
    options: ["market rate of interest is likely to fall", "Central Bank is no longer lending to commercial banks", "Central Bank is following an easy money policy", "Central Bank is following a tight money policy"]
    answer: 3
    year: 2013
    topic: "Monetary policy"
