# ── The Money Printer · data spine ────────────────────────────────────────────
# Feeds the "Money Printer" panel on the Bloomburger Terminal (macro-watch.html,
# rendered by assets/js/money-printer.js).
#
# Provenance rules:
#   - Anchor values are the numbers read out in class from the 31 Jul 2026 WSS /
#     Section 42 return (Session 19, 23 Aug 2026), cross-checked against RBI data.
#   - Every ledger event carries a src URL. approx: true = order-of-magnitude,
#     awaiting reconciliation (see next line).
#   - HARSH TODO: your April 2026 deep-research note (≈8–9 L cr printed in the six
#     months to April, ≈5–6 L cr absorbed via the 3-yr dollar swaps) lives in the
#     old Claude account. When retrieved, replace the approx entries below and
#     drop the flag. The professor's assignment, verbatim, 23 Aug: "Why don't you
#     keep a track of it, Harsh — how much they're bringing in and how much
#     they're absorbing."
#   - The board shows DATED STOCKS, not a live feed. It used to tick every
#     second at the year's average pace — a debt-clock convention that asserted
#     something false (money is not created per second; it arrives in lumps and
#     is observed fortnightly). Removed 23 Aug 2026.
#   - Headline money figures are RBI's official M3 from the WSS. The Section 42
#     decomposition (deposits, credit) stays for the components view, where the
#     proxy's small bias is immaterial next to the component moves.

as_of: "31 Jul 2026 (WSS as read in class, 23 Aug 2026)"
anchor_iso: "2026-07-31"

# ── Live odometers (₹ lakh crore at anchor; yoy = change over year to anchor) ──
counters:
  - id: total
    label: "Money supply (M3)"
    sub: "RBI's own aggregate for the fortnight ended 31 Jul 2026 — +14.7% on the year. This replaces the class's deposits-plus-cash proxy, which under-read the year-ago level."
    v_lcr: 322.81
    yoy_lcr: 41.4
    src: "https://www.rbi.org.in/Scripts/BS_ViewWss.aspx"
  - id: deposits
    label: "Deposits with banks"
    sub: "all scheduled banks, WSS item 2A — ₹238 L cr a year ago"
    v_lcr: 274.0
    yoy_lcr: 36.0
  - id: cash
    label: "Currency with the public"
    sub: "₹41.85 L cr on the RBI's print, +12.9% — back to ~12% of GDP, pre-demonetisation territory"
    v_lcr: 41.85
    yoy_lcr: 4.78
  - id: credit
    label: "Bank credit"
    sub: "WSS row 8 — loans create deposits; both sides moved together"
    v_lcr: 225.0
    yoy_lcr: 40.0

# ── Nominal GDP · OFFICIAL, new 2022-23 base series (MoSPI, 27 Feb 2026) ──
# The class worked with ₹350 (FY26) and ₹325 (FY25). Neither matches any
# published vintage: the old 2011-12 series implies ~₹360 for FY26, the new
# series prints ₹346.36. Using official numbers, on one series, throughout.
gdp:
  fy26_lcr: 346.36       # PE, June 2026 · new 2022-23 base
  fy25_lcr: 318.07       # new 2022-23 base
  fy27_est_lcr: 377.0    # ASSUMPTION: ~8.8% nominal on FY26. Not an official print.
  src: "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2269286&reg=48&lang=1"
  note: "Nominal GDP at current prices, 2022-23 base. FY27 is an extrapolation used only for the trailing-four-quarter denominator; it is flagged wherever it moves a number."

# ── The dial · money ÷ GDP ──────────────────────────────────────────────────
# REBUILT 24 Aug 2026 after external review. The previous reading — 90.3% now,
# 81.5% a year ago, "+8.8 points" — was wrong three ways at once, and every
# error ran in the direction of drama:
#   1. MIXED BASIS. "Now" used the class aggregate (deposits + cash); "year ago"
#      used RBI's M3. Different definitions.
#   2. MIXED DATES. The ₹268 L cr behind 81.5% is M3 at MARCH 2025, not July.
#   3. UNOFFICIAL DENOMINATOR. Neither GDP figure matched a published series.
# Now: RBI M3 over TRAILING-FOUR-QUARTER nominal GDP, both dates, one basis.
# Trailing GDP matters — a point-in-time stock over a fiscal-year flow jumps
# by ~3 points every April for no economic reason at all.
ratio:
  now: 90.5              # M3 322.81 / TTM GDP 356.6 (fortnight ended 31 Jul 2026)
  band_low: 89.7         # same M3 over old-series FY26 GDP (~₹360 L cr)
  band_high: 93.2        # same M3 over new-series FY26 GDP (₹346.36) — above the COVID peak
  year_ago: 85.9         # M3 281.4 / TTM GDP 327.5 (Jul 2025)
  basis: "RBI M3 ÷ trailing-four-quarter nominal GDP (MoSPI 2022-23 series)"
  footnote: "Settled against the RBI's own print for the fortnight ended 31 July 2026: M3 ₹3,22,81,302 crore, +14.7% on the year — which confirms the class's ₹41 lakh crore and its ~90% level, and corrects this dial's earlier ₹316/₹350 arithmetic in both directions. The band is the denominator convention, not noise: trailing-four-quarter GDP gives 90.5%, the new-series fiscal-year print gives 93.2% (above the pandemic peak), the old series 89.7%. The rise on one basis is about 4.6 points — not the 8.8 this dial claimed until 24 August 2026, and not the 2.9 the first correction over-shot to. History pips removed: earlier levels sit on other vintages and were never comparable to this needle."

# ── Who actually created the money ──────────────────────────────────────────
# The section is called The Money Printer, so it has to say plainly which layer
# the RBI printed and which layer the banks created. Roughly ₹6 of every ₹35
# is central-bank money; the rest is deposit money created by banks lending.
layers:
  caption: "Of the ₹41.4 lakh crore added over the year, the central bank issued the smaller part. Banks created the rest by lending — the multiplier, not the press."
  rows:
    - { label: "The RBI issued", v_lcr: 6.0, approx: true, note: "reserve money — OMO purchases and FX operations. The CRR cut freed reserves that already existed rather than creating new ones." }
    - { label: "Banks created", v_lcr: 35.4, approx: true, note: "deposit money, against credit growth — every loan a bank books is a deposit somewhere. This is the part the printer metaphor does not cover." }
  fn: "Approximate, and the split is the point rather than the decimals: M3 grew 14.7% over the year, reserve money by roughly 12%. The RBI's own balance sheet grew ₹15.7 L cr (+20.6%), but a large share of that is gold revaluation — an accounting mark, not money creation. UNVERIFIED: the revaluation share needs computing from the WSS revaluation-account lines before it is ever quoted as a number."

# ── Eras: presets for the date filter and the printer throttle ──
# rate_lps = ₹ lakh per second added (negative = the machine ran in reverse).
eras:
  - id: quiet
    name: "The Quiet Print"
    span: "Jul 2025 – Jul 2026"
    from: "2025-07-25"
    to: "2026-07-31"
    operator: "Sanjay Malhotra · RBI"
    plate: "RBI · MINT STREET"
    screen: "+₹13.0 LAKH / SEC"
    press: "press-500.mp4"
    press_speed: 1.2
    press_tag: "₹500 — the workhorse note, at today's pace"
    currency: "₹"
    rate_lps: 13.0        # +41 L cr / year ≈ ₹13 lakh per second
    line: "M3 +14.7% against ~9% nominal GDP, and money-to-GDP up ~4.6 points to ~90%. The growth rate is high, not unprecedented — India ran 17–21% in 2005–08. What is unprecedented is the toolkit: a CRR cut, ₹2 L cr of OMOs and a $10bn swap, in a year with no crisis."
    default: true
  - id: covid
    name: "COVID QE"
    span: "Mar 2020 – Mar 2021"
    from: "2020-03-01"
    to: "2021-03-31"
    operator: "Shaktikanta Das · RBI"
    plate: "RBI · MINT STREET"
    screen: "+₹6.5 LAKH / SEC"
    press: "press-200.mp4"
    press_speed: 0.6
    press_tag: "₹200 — half of today's pace"
    currency: "₹"
    rate_lps: 6.5         # M3 ≈167.9 → ≈188.4 L cr in FY21
    line: "The understandable one: pandemic, collapsing GDP, pump first and ask later. M3-to-GDP touched the low-90s."
  - id: demon
    name: "Demonetisation"
    span: "Nov 2016 – Jan 2017"
    from: "2016-11-08"
    to: "2017-01-31"
    operator: "Urjit Patel · RBI"
    plate: "RBI · REVERSE GEAR"
    screen: "−₹18.9 LAKH / SEC"
    press: "press-wash.mp4"
    press_speed: 1.0
    press_tag: "the wash cycle — ₹15.4 L cr went in; 99.3% came back freshly laundered"
    currency: "₹"
    rate_lps: -18.9       # currency with public ≈17.97 → ≈9.0 L cr in ~55 days
    line: "The only time the machine ran in reverse — and it ran backwards faster than it has ever run forwards."
  - id: fed2020
    name: "Powell's Printer"
    span: "Mar – Jun 2020 · USA"
    from: "2020-02-26"
    to: "2020-06-10"
    operator: "Jerome Powell · Federal Reserve"
    plate: "US FEDERAL RESERVE"
    screen: "+$315,000 / SEC"
    press: "press-usd.mp4"
    press_speed: 1.5
    press_tag: "$100s, up close — ₹2.4 crore-equivalent every second"
    currency: "$"
    rate_lps: 236.0       # Fed balance sheet +$2.86T in 105 days ≈ $315,000/sec ≈ ₹2.36 crore/sec at ₹75
    line: "The meme was arithmetic: +$2.86 trillion in 105 days is $315,000 every second. In rupees of the day, ₹2.4 crore a second. Brrr."

# ── The Tap and the Sponge · ledger of injections (+) and absorptions (−) ──
# amt_lcr in ₹ lakh crore of primary/durable liquidity. approx: true ⇒ shown with ≈.
events:
  - date: "2016-11-08"
    era: demon
    kind: sponge
    label: "Demonetisation — ₹500/₹1,000 invalidated overnight"
    amt_lcr: -15.4
    note: "86% of currency in circulation withdrawn; ₹9 L cr of public cash vanished inside two months. 99.3% eventually came back."
    src: "https://vajiramandravi.com/current-affairs/nine-years-after-demonetisation-why-cash-in-circulation-remains-high/"
  - date: "2017-09-30"
    era: demon
    kind: tap
    label: "Remonetisation — the notes come back"
    amt_lcr: 15.0
    note: "By March 2018 currency with the public was back to ₹17.6 L cr. The sponge was temporary; the reprint was not. Net effect of the whole episode on money: ≈ zero. On velocity and trust: another matter."
    approx: true
    src: "https://vajiramandravi.com/current-affairs/nine-years-after-demonetisation-why-cash-in-circulation-remains-high/"
  - date: "2020-03-27"
    era: covid
    kind: tap
    label: "CRR cut 4% → 3% (COVID package)"
    amt_lcr: 1.37
    note: "One point of CRR ≈ ₹1.37 L cr of reserves freed — and the multiplier ceiling lifts from 25× to 33×."
    src: "https://www.rbi.org.in/Scripts/BS_PressReleaseDisplay.aspx?prid=49582"
  - date: "2020-03-27"
    era: covid
    kind: tap
    label: "TLTRO 1.0 + 2.0 — targeted long-term repos"
    amt_lcr: 1.13
    note: "Cheap 3-yr central-bank money for banks, earmarked for corporate bonds. Announced in the same 27 Mar statement as the CRR cut — ₹3.74 L cr of liquidity in one press release."
    approx: true
    src: "https://www.rbi.org.in/Scripts/BS_PressReleaseDisplay.aspx?prid=49582"
  - date: "2021-03-31"
    era: covid
    kind: tap
    label: "OMO purchases through FY21 (incl. Operation Twist)"
    amt_lcr: 3.1
    note: "The RBI bought G-secs all year to cap yields while the government borrowed a record ₹13.7 L cr."
    approx: true
    src: "https://www.rbi.org.in/Scripts/AnnualReportPublications.aspx"
  - date: "2021-05-22"
    era: covid
    kind: sponge
    label: "CRR restored 3% → 4% (two steps, Mar & May 2021)"
    amt_lcr: -1.4
    note: "The COVID tap, closed — announced in the Feb 2021 policy. Note the asymmetry with 2025: this time it was put back."
    src: "https://www.rbi.org.in/Scripts/BS_PressReleaseDisplay.aspx"
  - date: "2024-12-14"
    era: quiet
    kind: tap
    label: "CRR cut 4.5% → 4% (two tranches, 14 & 28 Dec 2024)"
    amt_lcr: 1.16
    note: "The opening move of this easing cycle — the first CRR cut in over four years, partly to offset the rupee squeezed out by dollar sales."
    src: "https://www.business-standard.com/markets/capital-market-news/crr-cut-to-release-primary-liquidity-of-about-rs-1-16-lakh-crore-to-the-banking-system-says-rbi-124120600386_1.html"
  - date: "2025-03-24"
    era: quiet
    kind: tap
    label: "USD/INR buy-sell swaps — $25bn across Jan–Mar 2025"
    amt_lcr: 2.17
    note: "Rupees out today, dollars back in 2026–28. The sponge is pre-booked: these swaps mature and reverse — this is the mechanism in Harsh's April note."
    src: "https://www.business-standard.com/economy/news/rbi-to-conduct-10-billion-buy-sell-swap-to-infuse-durable-liquidity-125022101273_1.html"
  - date: "2025-06-30"
    era: quiet
    kind: tap
    label: "OMO purchases, Jan–Jun 2025"
    amt_lcr: 5.2
    note: "Bond-buying to move the system to surplus while the centre and states borrowed — the 'financing state borrowing' channel from class."
    approx: true
    src: "https://www.business-standard.com/markets/capital-market-news/rbi-announces-omo-purchase-of-government-of-india-securities-for-rs-50000-crore-125043000547_1.html"
  - date: "2025-11-29"
    era: quiet
    kind: tap
    label: "CRR cut 4% → 3% — four tranches, Sep 6 / Oct 4 / Nov 1 / Nov 29"
    amt_lcr: 2.5
    note: "Announced 6 Jun 2025. ₹2.5 L cr of primary liquidity by December — and the deposit-creation ceiling moves from 25× to 33× per rupee of reserves."
    src: "https://www.deccanherald.com/business/rbi-cuts-crr-by-a-steep-1-to-unlock-rs-25-lakh-crore-to-bank-funds-by-december-3574139"
  - date: "2026-01-22"
    era: quiet
    kind: tap
    label: "OMO purchases ₹2 L cr — four tranches, 29 Dec–22 Jan"
    amt_lcr: 2.0
    note: "₹50,000 cr each on Dec 29, Jan 5, Jan 12, Jan 22 — announced alongside the swap below as a ₹3-trillion package."
    src: "https://ddnews.gov.in/en/rbi-announces-%E2%82%B93-trillion-liquidity-injection-through-omos-and-forex-swap/"
  - date: "2026-01-13"
    era: quiet
    kind: tap
    label: "USD/INR buy-sell swap — $10bn, 3-year tenor"
    amt_lcr: 0.88
    note: "Injects now; the reversal is due January 2029. Add it to the pre-booked sponge."
    src: "https://upstox.com/news/business-news/financial-regulations/rbi-to-inject-liquidity-via-2-lakh-crore-omo-purchases-10-billion-forex-swap/article-186668/"
  - date: "2026-04-15"
    era: quiet
    kind: sponge
    label: "Dollar sales in defence of the rupee, H1 2026"
    amt_lcr: null
    note: "Selling dollars buys back rupees — a squeeze, not a print. Size unquantified in class ('that would have actually squeezed more money'). Reconcile with the April deep-research note."
    approx: true
    src: "https://website.rbi.org.in/web/rbi/publications/weekly-statistical-supplement"
  - date: "2026-08-14"
    era: quiet
    kind: tap
    label: "Rebuilding forex reserves — now ~$720bn"
    amt_lcr: null
    note: "Buying dollars releases rupees. 'Last few days, yes — they are building forex reserves now.' Among the largest reserve piles in the world."
    approx: true
    src: "https://website.rbi.org.in/web/rbi/publications/weekly-statistical-supplement"

# ── Chart series ──
# Dots are dated anchors (sourced); the JS interpolates between them for the line.
# cwp = currency with the public, dep = deposits with banks (₹ lakh crore),
