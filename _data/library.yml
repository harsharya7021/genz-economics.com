# Read-aloud (TTS) sample text used to demo the browser speech engine.
readaloud_sample: >
  Inflation is the rate at which the general level of prices for goods and
  services rises, eroding purchasing power. India's Monetary Policy Committee
  targets consumer price inflation of four percent, within a band of two to six.
  When inflation runs hot, the central bank can raise the repo rate to cool demand.
