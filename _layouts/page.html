---
layout: default
---

<article class="post page">
  <div class="container narrow">
    <header class="post-header">
      <h1 class="post-title-display">{{ page.title }}</h1>
      {% if page.dek %}<p class="lede">{{ page.dek }}</p>{% endif %}
    </header>
    <div class="post-body">
      {{ content }}
    </div>
  </div>
</article>
