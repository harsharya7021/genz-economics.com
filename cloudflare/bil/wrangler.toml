name = "gze-bil"
main = "worker.js"
compatibility_date = "2025-07-01"
workers_dev = true

# Workers AI — embeddings (bge) + generation (llama). No external LLM key needed.
[ai]
binding = "AI"

# Vectorize — the corpus index the ingest script fills.
[[vectorize]]
binding = "VECTORIZE"
index_name = "gze-bil"

# Optional extra allowed emails, comma-separated. ISB addresses + the owner are
# already hard-allowed in worker.js; use this only to add one-off guests.
[vars]
ALLOWED = ""

# No secret required. The Firebase sign-in token is verified cryptographically
# against Google's public JWKs inside worker.js (verify()) — no API key, so the
# web apiKey's referrer restriction can't block it.
