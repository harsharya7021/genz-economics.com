# ─────────────────────────────────────────────────────────────
# Gen Z Economics — Jekyll config
# ─────────────────────────────────────────────────────────────

title: Gen Z Economics
tagline: Macro that's actually useful — Prof. Tantri's sessions, by sign-in only.
description: >
  Prof. Prasanna Tantri's macroeconomics sessions — notes, lectures, and the
  papers worth your time. Behind a login, for people who want useful knowledge,
  not the nonsense on TV. One new session a week.
url: "https://genz-economics.com"
baseurl: ""
lang: en
timezone: Asia/Kolkata

# Build
permalink: /:year/:month/:title/
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# Plugins (all supported by GitHub Pages)
# Note: feed.xml is now hand-written (in /feed.xml) so we exclude jekyll-feed
# to keep drafts out of the RSS while still rendering on direct URL.
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

paginate: 10
paginate_path: "/page:num/"

# Collections / defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true

# Site metadata
author:
  name: The Gen Z Economics Community
  email: hello@genz-economics.com

social:
  github: genz-economics
  twitter: genzeconomics

# Editorial
repository: "harsharya7021/genz-economics.com"
edit_base_url: "https://github.com/harsharya7021/genz-economics.com/edit/main"
issue_base_url: "https://github.com/harsharya7021/genz-economics.com/issues/new/choose"

# ─────────────────────────────────────────────────────────────
# Feature flags
# ─────────────────────────────────────────────────────────────
# Recordings stay private until Prof. Tantri approves publishing them.
# Flip this to `true` to switch every gated lecture player on site-wide.
lectures_enabled: true
# Optional: your Cloudflare Stream customer code (Stream dashboard URL). Blank = use videodelivery.net.
stream_customer_code: ""

# Skip noise — internal docs and tooling must never hit the Jekyll build
# (GH Pages renders markdown even without front matter, and these contain
# literal {% raw %}Liquid{% endraw %} snippets that break it)
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - _backup_pre-reskin*
  - README.md
  - CONTRIBUTING.md
  - MODERATORS.md
  - CODE_OF_CONDUCT.md
  - .github
  - HANDOFF.md
  - SPEC-KARMA-GATING.md
  - ARCHITECTURE.md
  - VOICE-TANTRI.md
  - VOICE-RAW-TANTRI.md
  - COMMENTS-SETUP.md
  - DEPLOY.md
  - DEPLOY-RENDER.md
  - VIDEO-SETUP.md
  - LICENSE
  - automation
  - scripts
  - render.yaml
  - landing-v2-PREVIEW.html
  - corporate-finance-v9-PREVIEW.html

